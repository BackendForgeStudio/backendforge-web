<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargar Portada Fiverr - BackendForge</title>
  <style>
    body {
      background: #020617;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    canvas {
      max-width: 90%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      margin-bottom: 24px;
      border: 1px solid #1e293b;
    }
    button {
      background: #10b981;
      color: #020617;
      border: none;
      font-weight: 800;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #34d399;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <canvas id="coverCanvas" width="1280" height="769"></canvas>
  <button onclick="downloadPNG()">⬇️ Descargar Portada Gig PNG (1280x769)</button>

  <script>
    const canvas = document.getElementById('coverCanvas');
    const ctx = canvas.getContext('2d');

    // 1. Fondo Degradado
    const bgGrad = ctx.createLinearGradient(0, 0, 1280, 769);
    bgGrad.addColorStop(0, '#020617');
    bgGrad.addColorStop(1, '#0b1329');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1280, 769);

    // 2. Resplandor Esmeralda
    const glow = ctx.createRadialGradient(1050, 250, 20, 1050, 250, 450);
    glow.addColorStop(0, 'rgba(16, 185, 129, 0.18)');
    glow.addColorStop(1, 'rgba(2, 6, 23, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 1280, 769);

    // 3. Marca superior (BackendForge Studio)
    ctx.beginPath();
    ctx.fillStyle = '#34d399';
    ctx.arc(90, 90, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('BackendForge', 110, 90);
    ctx.fillStyle = '#10b981';
    ctx.font = '20px monospace';
    ctx.fillText('STUDIO', 285, 91);

    // 4. Badge Superior
    ctx.beginPath();
    ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 1.5;
    ctx.roundRect(90, 140, 270, 36, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#34d399';
    ctx.font = 'bold 14px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚡ PRODUCTION-READY APIS', 108, 158);

    // 5. Título Principal
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 60px system-ui';
    ctx.fillText('Custom REST APIs &', 90, 250);
    ctx.fillStyle = '#34d399';
    ctx.fillText('Supabase Databases', 90, 325);

    // 6. Subtítulo
    ctx.fillStyle = '#94a3b8';
    ctx.font = '500 22px system-ui';
    ctx.fillText('Fast, secure microservices built with Node.js & PostgreSQL', 90, 390);

    // 7. Tarjetas de características (Features)
    function drawTag(text, x, y) {
      ctx.beginPath();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      ctx.roundRect(x, y, 310, 48, 10);
      ctx.fill();
      ctx.stroke();

      // Icono Check
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 18px system-ui';
      ctx.textBaseline = 'middle';
      ctx.fillText('✓', x + 16, y + 24);

      // Texto de la tarjeta
      ctx.fillStyle = '#f8fafc';
      ctx.font = '600 15px system-ui';
      ctx.fillText(text, x + 40, y + 24);
    }

    drawTag('48-72h Fast Turnaround', 90, 460);
    drawTag('Row-Level Security (RLS)', 420, 460);
    drawTag('JWT / API Key Auth', 90, 525);
    drawTag('Webhooks & Integrations', 420, 525);
    drawTag('Postman Collection Docs', 90, 590);
    drawTag('100% Full Code Ownership', 420, 590);

    // 8. Tarjeta de Código (Derecha)
    ctx.beginPath();
    ctx.fillStyle = '#090e1a';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    ctx.roundRect(770, 140, 420, 500, 16);
    ctx.fill();
    ctx.stroke();

    // Barra superior de la ventana
    ctx.beginPath();
    ctx.fillStyle = '#0f172a';
    ctx.roundRect(770, 140, 420, 44, [16, 16, 0, 0]);
    ctx.fill();

    // Botones de ventana
    ctx.beginPath(); ctx.fillStyle = '#ef4444'; ctx.arc(795, 162, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = '#f59e0b'; ctx.arc(815, 162, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = '#10b981'; ctx.arc(835, 162, 6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#64748b';
    ctx.font = '13px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText('api.serverless.ts', 960, 162);

    // Código Mockup
    const codeLines = [
      { text: '// Supabase & REST Endpoint', color: '#64748b' },
      { text: 'export default async (req, res) => {', color: '#c084fc' },
      { text: '  const { user_id, action } = req.body;', color: '#cbd5e1' },
      { text: '', color: '' },
      { text: '  const { data, error } = await db', color: '#38bdf8' },
      { text: '    .from("records")', color: '#34d399' },
      { text: '    .insert([{ user_id, action }]);', color: '#38bdf8' },
      { text: '', color: '' },
      { text: '  if (error) return res.status(500);', color: '#f87171' },
      { text: '  return res.status(200).json({', color: '#c084fc' },
      { text: '    status: "success",', color: '#34d399' },
      { text: '    deployed: true', color: '#34d399' },
      { text: '  });', color: '#c084fc' },
      { text: '};', color: '#c084fc' }
    ];

    ctx.font = '14px monospace';
    let codeY = 220;
    codeLines.forEach(line => {
      if (line.text) {
        ctx.fillStyle = line.color;
        ctx.fillText(line.text, 795, codeY);
      }
      codeY += 26;
    });

    // Tech Logos Footer
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('NODE.JS  •  SUPABASE  •  VERCEL', 835, 605);

    function downloadPNG() {
      const link = document.createElement('a');
      link.download = 'fiverr-gig-cover.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
