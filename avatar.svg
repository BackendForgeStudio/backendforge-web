<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#34d399" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="500" height="500" rx="40" fill="#020617"/>
  <circle cx="250" cy="250" r="230" fill="url(#glow)"/>
  
  <!-- Borde Circular -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Letras BF -->
  <text x="242" y="270" text-anchor="middle" fill="#34d399" font-size="160" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-4" filter="url(#shadow)">BF</text>

  <!-- Punto de Estado Activo -->
  <circle cx="360" cy="180" r="14" fill="#34d399" filter="url(#shadow)"/>
</svg>
